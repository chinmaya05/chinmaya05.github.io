<section id="experience" class="section">
  <div class="container">
    <div class="section-head" reveal>
      <div class="eyebrow">Experience</div>
      <h2>Where I have <span class="grad-text">worked</span></h2>
    </div>

    <div class="timeline">
      @for (job of jobs; track job.company; let i = $index) {
        <div class="item" reveal [revealDelay]="i * 100">
          <span class="node"></span>
          <article class="card job" spotlight>
            <div class="top">
              <div>
                <h3>{{ job.role }}</h3>
                <p class="company">
                  {{ job.company }} <span>· {{ job.place }}</span>
                </p>
              </div>
              <span class="period">{{ job.period }}</span>
            </div>

            <ul class="points">
              @for (pt of job.points; track pt) {
                <li>
                  <app-icon name="check" /><span>{{ pt }}</span>
                </li>
              }
            </ul>

            <div class="chips">
              @for (t of job.tech; track t) {
                <span class="chip">{{ t }}</span>
              }
            </div>
          </article>
        </div>
      }
    </div>
  </div>
</section>
