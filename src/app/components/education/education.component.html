<section id="education" class="section">
  <div class="container">
    <div class="section-head" reveal>
      <div class="eyebrow">Education</div>
      <h2>Academic <span class="grad-text">background</span></h2>
    </div>

    <div class="grid">
      @for (e of items; track e.degree; let i = $index) {
        <div reveal [revealDelay]="i * 110">
          <article class="card edu" spotlight>
            <span class="score">{{ e.score }}</span>
            <h3>{{ e.degree }}</h3>
            <p class="school">{{ e.school }}</p>
            <span class="period">{{ e.period }}</span>
          </article>
        </div>
      }
    </div>
  </div>
</section>
